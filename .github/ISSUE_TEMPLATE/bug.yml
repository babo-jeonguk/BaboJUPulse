name: Bug report
description: Report behavior that is broken or has regressed.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, account identifiers, or private provider data. Redact logs before attaching them.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reproduces the problem. Say if it is intermittent.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BaboJUPulse version or commit
      placeholder: "e.g. 0.1.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2 (build 26100)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Paste relevant output with secrets and account data removed.
      render: text
    validations:
      required: false
