name: Feature request
description: Propose a product capability or a change to an existing one.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and the desired behavior. You do not need to provide an architectural design or implementation plan. Do not include credentials, account data, local absolute paths, or references to local-only working artifacts.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: I removed credentials, account data, and local-only paths from the request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What situation is difficult or impossible today? Describe the user need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: What should the product do? Include the taskbar or tray surface when relevant.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: Who benefits, and what becomes easier or safer?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and scope
      description: Does this affect one provider, all providers, or the system-monitoring path? What should explicitly stay out of scope?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider, and why is it worse?
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link provider documentation, API documentation, or comparable behavior. Do not include credentials or account data.
    validations:
      required: false
