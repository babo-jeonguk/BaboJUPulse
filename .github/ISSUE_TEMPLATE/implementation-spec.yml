name: Implementation specification
description: Internal, implementation-ready contract for a scoped change.
title: "[Spec]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for maintainers and agents preparing implementation work. Completing it does not make the issue ready: maintainer triage must confirm the scope and apply `ready-for-agent` or `ready-for-human`.

        Do not include credentials, account data, local absolute paths, or references to local-only working artifacts. Use verified public references or tracked repository files.
  - type: textarea
    id: problem-objective
    attributes:
      label: Problem and objective
      description: What problem exists, and what observable outcome should this change produce?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Verified references
      description: Link public documentation, tracked files, issues, or commits that establish the required behavior. Say what was verified and what remains unknown.
    validations:
      required: false
  - type: textarea
    id: behavioral-requirements
    attributes:
      label: Behavioral requirements
      description: State the required behavior precisely enough to test. Include user-visible behavior, data handling, and provider or Windows-specific constraints.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Name architecture boundaries, dependency limits, compatibility requirements, security or privacy rules, and non-negotiable quality gates.
    validations:
      required: true
  - type: textarea
    id: edge-cases
    attributes:
      label: Edge cases and failure behavior
      description: What happens when data is missing, a provider is unavailable, a sensor does not exist, a request fails, or the user cancels?
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Explicit out-of-scope
      description: What must not be added or changed in this issue?
    validations:
      required: true
  - type: textarea
    id: slices
    attributes:
      label: Implementation slices
      description: List small coherent slices. Each slice should state its purpose, scope, and verification.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Give observable, testable criteria. Each criterion should have a verification method.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification requirements
      description: List commands, tests, CI checks, or Windows runtime checks required for this issue. Distinguish build success from runtime verification.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues, external decisions, or required access. Write "None" when there are none.
    validations:
      required: false
