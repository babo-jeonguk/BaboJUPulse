name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check public content
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${PR_TITLE:-}" ] || [ -n "${PR_BODY:-}" ]; then
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/check-public-content.sh
          fi
          if [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git log --format=%B "$BASE_SHA..$HEAD_SHA" | bash scripts/check-public-content.sh
          else
            git log --format=%B -1 "$HEAD_SHA" | bash scripts/check-public-content.sh
          fi
          bash scripts/check-public-content.sh --tracked
          bash scripts/test-public-content.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BaboJUPulse.slnx

      - name: Verify formatting
        run: dotnet format BaboJUPulse.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build BaboJUPulse.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test BaboJUPulse.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Verify repository policy
        run: dotnet test tests/BaboJUPulse.ArchitectureTests/BaboJUPulse.ArchitectureTests.csproj -c Release --no-build --filter "Category=RepositoryPolicy" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7
