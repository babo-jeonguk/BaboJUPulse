name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate documentation
        shell: bash
        run: |
          bash scripts/test-check-documentation.sh
          bash scripts/check-documentation.sh
          bash scripts/test-public-content.sh
          bash scripts/check-public-content.sh --tracked
