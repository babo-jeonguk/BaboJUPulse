name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install ShellCheck
        shell: bash
        run: |
          version=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck

      - name: Validate documentation
        shell: bash
        run: |
          bash scripts/test-check-documentation.sh
          bash scripts/check-documentation.sh
          bash scripts/test-public-content.sh
          bash scripts/check-public-content.sh --tracked

      - name: Validate workflow scripts
        shell: bash
        run: |
          command -v jq >/dev/null 2>&1 || { echo 'jq is required'; exit 1; }
          bash scripts/check-workflow-shell.sh
          bash scripts/test-workflow.sh
